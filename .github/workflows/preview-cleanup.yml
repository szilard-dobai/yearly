name: Clean up previews

on:
  pull_request:
    types: [closed]
  delete:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name != 'delete' || github.event.ref_type == 'branch') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/cleanup-previews.mts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Delete preview deployments and database branches
        run: |
          if [ -n "$BRANCH" ]; then
            node scripts/cleanup-previews.mts "$BRANCH"
          else
            node scripts/cleanup-previews.mts --stale
          fi
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || (github.event_name == 'delete' && github.event.ref) || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
